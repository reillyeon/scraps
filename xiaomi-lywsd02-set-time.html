<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Configure Xiaomi LYWSD02</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=2">
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .control-group { margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        label { margin-right: 15px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="control-group">
        <label>Temperature Units</label>
        <label>
            <input type="radio" name="tempUnit" value="C" checked> Celsius (°C)
        </label>
        <label>
            <input type="radio" name="tempUnit" value="F"> Fahrenheit (°F)
        </label>
    </div>

    <button id="set">Set Time & Temperature Units</button>
    <span id="status"></span>

    <script>
        const status = document.getElementById('status');
        
        document.getElementById('set').addEventListener('click', async () => {
            const SERVICE_UUID = 'ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6';
            const TIME_CHARACTERISTIC_UUID = 'ebe0ccb7-7a0a-4b0c-8a1a-6ff2997da3a6';
            const TEMP_UNIT_CHARACTERISTIC_UUID = 'ebe0ccbe-7a0a-4b0c-8a1a-6ff2997da3a6';

            const options = {
                filters: [
                    {name: 'LYWSD02'},
                    {name: 'LYWSD02MMC'}
                ],
                optionalServices: [SERVICE_UUID],
            };

            try {
                status.textContent = 'Requesting device...';
                const device = await navigator.bluetooth.requestDevice(options);
                
                status.textContent = 'Connecting...';
                const server = await device.gatt.connect();
                
                status.textContent = 'Getting service...';
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                status.textContent = 'Getting time characteristic...';
                const time_characteristic = await service.getCharacteristic(TIME_CHARACTERISTIC_UUID);

                const buffer = new ArrayBuffer(5);
                const view = new DataView(buffer);
                const now = new Date();
                
                // First 4 bytes: Unix timestamp (in seconds, little endian)
                view.setUint32(0, now.getTime() / 1000, true);
                
                // Base 5th byte value: Offset from UTC (in hours)
                let tzOffset = -now.getTimezoneOffset() / 60;
                view.setUint8(4, tzOffset);
                
                status.textContent = 'Setting time...';
                await time_characteristic.writeValueWithoutResponse(buffer);

                // Get desired temperature units mode
                let tempunit = 0;
                const selectedUnit = document.querySelector('input[name="tempUnit"]:checked').value;
                if (selectedUnit === 'F') {
                    tempunit = 0x1; 
                }

                status.textContent = 'Getting temp unit characteristic...';
                const temp_unit_characteristic = await service.getCharacteristic(TEMP_UNIT_CHARACTERISTIC_UUID);
            
                status.textContent = 'Setting temperature units...';
                const tempbyte = new Uint8Array([tempunit]); 
                await temp_unit_characteristic.writeValueWithoutResponse(tempbyte);
                
                server.disconnect();
                status.textContent = 'Done.';
            } catch (e) {
                status.textContent = `${e.name}: ${e.message}`;
            }
        });
    </script>
</body>
</html>
